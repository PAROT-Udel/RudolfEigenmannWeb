<!DOCTYPE html>
<html>
<head>
  <title>Publications bibliography</title>
  <meta charset="utf-8">
  <style>
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <pre id="bib-content">Loading references.bib…</pre>

<script>
  // Same-folder fetch so this page and the Publications list share one .bib file.
  fetch('references.bib')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.text();
    })
    .then(function (content) {
      document.getElementById('bib-content').textContent = content;
    })
    .catch(function (error) {
      document.getElementById('bib-content').textContent =
        'Could not load references.bib: ' + error;
      console.error('Error fetching .bib file:', error);
    });
</script>
</body>
</html>
